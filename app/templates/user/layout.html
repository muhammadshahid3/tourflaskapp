{% extends "base.html" %}
{% block content %}
<div class="container py-4">
  <div class="row g-4">
    <div class="col-md-3">
      <div class="card border-0 shadow-sm rounded-4 p-3">
        <div class="text-center mb-3">
          <div class="rounded-circle bg-primary text-white d-inline-flex align-items-center justify-content-center" style="width:64px;height:64px;font-size:1.5rem;">
            {{ current_user.full_name[0]|upper }}
          </div>
          <h6 class="fw-bold mt-2 mb-0">{{ current_user.full_name }}</h6>
          <small class="text-secondary">{{ current_user.email }}</small>
        </div>
        <div class="list-group list-group-flush">
          <a href="{{ url_for('user.dashboard') }}" class="list-group-item list-group-item-action {{ 'active' if request.endpoint == 'user.dashboard' }}"><i class="fa-solid fa-gauge-high me-2"></i>Dashboard</a>
          <a href="{{ url_for('user.tours') }}" class="list-group-item list-group-item-action {{ 'active' if 'tour' in request.endpoint }}"><i class="fa-solid fa-suitcase-rolling me-2"></i>Browse Tours</a>
          <a href="{{ url_for('user.my_bookings') }}" class="list-group-item list-group-item-action {{ 'active' if 'booking' in request.endpoint }}"><i class="fa-solid fa-calendar-check me-2"></i>My Bookings</a>
          <a href="{{ url_for('user.profile') }}" class="list-group-item list-group-item-action {{ 'active' if request.endpoint == 'user.profile' }}"><i class="fa-solid fa-user-pen me-2"></i>Profile</a>
          <a href="{{ url_for('auth.user_change_password') }}" class="list-group-item list-group-item-action"><i class="fa-solid fa-key me-2"></i>Change Password</a>
          <a href="{{ url_for('auth.user_logout') }}" class="list-group-item list-group-item-action text-danger"><i class="fa-solid fa-right-from-bracket me-2"></i>Logout</a>
        </div>
      </div>
    </div>
    <div class="col-md-9">
      {% block user_content %}{% endblock %}
    </div>
  </div>
</div>
{% endblock %}
